name: TransitAtlas
options:
  bundleIdPrefix: org.southernnewengland
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  TransitAtlas:
    type: application
    platform: iOS
    sources:
      - path: TransitAtlas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.southernnewengland.transitatlas
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Transit Atlas
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Connect to your own Transit Atlas server on your local network."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    info:
      path: TransitAtlas/Info.plist
      properties:
        CFBundleDisplayName: Transit Atlas
        NSLocalNetworkUsageDescription: Connect to your own Transit Atlas server on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
