name: Transit Atlas routing verification
on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    paths:
      - 'android/**'
      - 'routing.py'
      - 'transfer_edges.py'
      - 'street_routing.py'
      - 'scripts/build_street_graph.py'
      - 'tests/**'
      - '.github/workflows/routing-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile routing modules
        run: python -m py_compile routing.py transfer_edges.py street_routing.py scripts/build_street_graph.py
      - name: Run synthetic routing tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug APK and run JVM unit tests
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Upload debug APK for review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: transit-atlas-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  publish-experimental-release:
    name: Publish private experimental APK release
    needs: [python-routing, android-debug]
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: transit-atlas-debug-apk
          path: dist
      - name: Verify and prepare APK
        id: package
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/app-debug.apk
          short_sha="${GITHUB_SHA:0:12}"
          tag="atlas-dev-${short_sha}"
          cp dist/app-debug.apk "dist/transit-atlas-debug-${short_sha}.apk"
          sha256sum "dist/transit-atlas-debug-${short_sha}.apk" > "dist/SHA256SUMS.txt"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "apk=dist/transit-atlas-debug-${short_sha}.apk" >> "${GITHUB_OUTPUT}"
      - name: Publish prerelease after both test jobs pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.package.outputs.tag }}
          APK: ${{ steps.package.outputs.apk }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --target "${GITHUB_SHA}" \
              --title "Transit Atlas experimental ${GITHUB_SHA:0:12}" \
              --notes "Private experimental Android debug build from ${GITHUB_REF_NAME}. Both Python and Android build/JUnit CI jobs passed. No GTFS data is bundled. Debug APK signing can differ between CI runners: if Android reports an incompatible update, uninstall the previous experimental build first (this removes its app-private offline packs). Not production-ready." \
              --prerelease \
              --latest=false
          fi
          gh release upload "${TAG}" "${APK}" dist/SHA256SUMS.txt --clobber
