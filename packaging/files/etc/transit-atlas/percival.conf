# Percival companion configuration for the Transit Atlas package.
# Local model served by Ollama (see: transit-atlas setup-ollama).
# Ember's default (owner-delegated choice, 2026-11-15): Qwen3 1.7B —
# tool-calling capable at a size that survives a Chromebook container.
OLLAMA_MODEL=qwen3:1.7b
# Port the Atlas web app listens on (loopback by default via the launcher).
ATLAS_PORT=8000
